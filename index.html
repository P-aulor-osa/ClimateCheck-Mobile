
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta do Clima</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f5c99">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body>

<!-- Cabeçalho do site, com uma breve introdução -->

    <header>
        <h1>ClimateCheck</h1>
        <p>Aqui você pode consultar o clima de qualquer cidade.</p>
    </header>
<!-- Formulário para consulta do clima, com um campo de entrada para o nome da cidade e um botão de envio -->
    <main>
        <form>
            <h2>Consulta do Clima</h2>
            <p>Digite o nome de uma cidade para buscar o clima, além de informações adicionais.</p>
            <input id="cidade" placeholder="Digite o nome da cidade" required>
            <button id="buscar" type="button">Consultar</button>
        </form>

<!-- Seção que possibilita a exibição dos resultados no innerHTML do JS -->

        <section id="resultado">
            <h2> Resultado da Consulta</h2>
            <p id="temperatura"></p>
            <p id="umidade"></p>
            <p id="vento"></p>
            <p id="codigoClima"></p>
        </section>
    </main>
<!-- Rodapé do site, com informações de localização e direitos autorais -->
 <footer>
            <p>Lages, SC</p>
            <time datetime="2026">© 2026 ClimateCheck. Todos os direitos reservados.</time>
    </footer>
    <script src="script.js"></script>
</body>
</html>
